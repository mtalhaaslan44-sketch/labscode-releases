name: Build installers

# Builds one tagged version of the Labs Code source (a private repository) and
# publishes its installers here, where the website and installed apps get them.
#
#   gh workflow run build.yml -R mtalhaaslan44-sketch/labscode-releases -f tag=v0.4.5
#
# It starts only by hand (no push or pull request trigger), so only people who
# can write to this repository can run it, and the read-only source key
# (SOURCE_DEPLOY_KEY, set by `npm run setup:builds` in the source) never reaches
# code from anyone else. The key is not kept on disk after checkout, so install
# scripts of dependencies cannot read it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag in the source repository, e.g. v0.4.5
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.tag }}

env:
  SOURCE_REPO: mtalhaaslan44-sketch/labscode
  TAG: ${{ inputs.tag }}

jobs:
  check:
    name: Tests and release draft
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a version tag: $TAG"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      # The installers take their version from the package files. A tag that
      # does not match would publish old-numbered installers under the new tag,
      # and installed apps would never see the update.
      - name: Check the version matches the tag
        run: |
          for file in package.json apps/desktop/package.json apps/server/package.json apps/web/package.json packages/shared/package.json; do
            version=$(node -p "require('./$file').version")
            if [ "$version" != "${TAG#v}" ]; then
              echo "::error::$file has version $version, but the tag is $TAG"
              exit 1
            fi
          done
      - uses: actions/setup-node@v5
        with:
          # 22+: node --test expands the test file globs itself.
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate -w @labscode/server
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Browser regression tests
        run: npm run test:e2e
      # A draft until every installer is up: the website and installed apps
      # never see half a release. Notes come from changelog/<tag>.md in the
      # source when it has one; a draft made beforehand keeps its own notes.
      - name: Create the release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release $TAG already exists."
          elif [ -f "changelog/$TAG.md" ]; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target main --title "Labs Code ${TAG#v}" --notes-file "changelog/$TAG.md"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target main --title "Labs Code ${TAG#v}" --notes "Labs Code ${TAG#v}"
          fi

  package:
    name: Build ${{ matrix.name }} installers
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            args: --win nsis --x64
          - name: macOS
            os: macos-14
            args: --mac dmg zip --x64 --arm64
          - name: Linux
            os: ubuntu-22.04
            args: --linux AppImage deb -c.npmRebuild=true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        if: runner.os != 'Linux'
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate -w @labscode/server
      # Signing turns on by itself once its secrets exist in this repository
      # (`npm run setup:signing` in the source). Without them the Mac app is
      # ad-hoc signed and the Windows installer unsigned.
      - name: Use the signing certificates that are configured
        if: runner.os != 'Linux'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -z "$MAC_CERT_P12_BASE64" ]; then
              echo "::notice::No Apple Developer ID certificate yet: the Mac app is ad-hoc signed."
              exit 0
            fi
            # Signed but not notarized is still blocked by Gatekeeper, so both or neither.
            if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
              echo "::error::The Apple certificate is set but the notarization key is not. Run npm run setup:signing again."
              exit 1
            fi
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            {
              echo "CSC_LINK=$MAC_CERT_P12_BASE64"
              echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD"
              echo "APPLE_API_KEY=$key"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
            echo "Mac app: Developer ID signing and notarization on."
          else
            if [ -z "$WIN_CERT_PFX_BASE64" ]; then
              echo "::notice::No Windows code-signing certificate: the installer is unsigned."
              exit 0
            fi
            {
              echo "WIN_CSC_LINK=$WIN_CERT_PFX_BASE64"
              echo "WIN_CSC_KEY_PASSWORD=$WIN_CERT_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Windows installer: signing on."
          fi
      - name: Build installers
        run: npm run dist -w @labscode/desktop -- ${{ matrix.args }}
      # The Microsoft Store package, made from the app just built, once its
      # identity from Partner Center is set (repository variables). The Store
      # signs it, so it is built unsigned. It is kept as a short-lived build
      # artifact for the Partner Center upload, not offered as a download.
      - name: Build the Microsoft Store package
        if: runner.os == 'Windows' && vars.MSSTORE_IDENTITY_NAME != ''
        shell: bash
        working-directory: apps/desktop
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          env -u WIN_CSC_LINK -u WIN_CSC_KEY_PASSWORD -u CSC_LINK -u CSC_KEY_PASSWORD npx electron-builder --win appx --x64 --prepackaged ../../release/win-unpacked --publish never \
            "-c.appx.identityName=$MSSTORE_IDENTITY_NAME" "-c.appx.publisher=$MSSTORE_PUBLISHER" "-c.appx.publisherDisplayName=$MSSTORE_PUBLISHER_DISPLAY_NAME"
      - name: Keep the Microsoft Store package
        if: runner.os == 'Windows' && vars.MSSTORE_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-${{ inputs.tag }}
          path: release/*.appx
          retention-days: 7
      # The latest*.yml and .blockmap files are what the in-app updater reads.
      - name: Upload installers to the release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.blockmap release/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No installers were built"; exit 1; fi
          gh release upload "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish the release
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Every platform must be there before anyone is offered the update.
      - name: Check every installer is in the draft
        run: |
          names=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          version="${TAG#v}"
          for expected in "Labs-Code-Setup-$version.exe" "Labs-Code-$version-arm64.dmg" "Labs-Code-$version-x64.dmg" "Labs-Code-$version-arm64.zip" "Labs-Code-$version-x64.zip" "labs-code-$version-x86_64.AppImage" "labs-code-$version-amd64.deb" latest.yml latest-mac.yml latest-linux.yml; do
            if ! grep -qx "$expected" <<< "$names"; then
              echo "::error::Missing from the release: $expected"
              exit 1
            fi
          done
      - name: Publish
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
